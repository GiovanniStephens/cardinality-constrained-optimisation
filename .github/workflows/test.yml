name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # run every Python leg to completion so all failures surface together
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ benchmark/

      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover tests
          coverage report --fail-under=60

      - name: Type check
        continue-on-error: true
        run: mypy src/ --ignore-missing-imports


  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libeigen3-dev

      - name: Build C++ optimiser
        run: make build-cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run C++ equivalence tests
        run: python -m unittest tests.test_cpp_equivalence
