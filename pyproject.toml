[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cardinality-constrained-optimisation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "arch>=5.0,<7",
    "copulae>=0.7,<1",
    "financedatabase>=2.0",
    "matplotlib>=3.3",
    "muarch>=1.0",
    "numpy>=1.21,<2",
    "pandas>=1.1,<3",
    "pmdarima>=2.0,<3",
    "pulp>=2.7,<3",
    "pygad>=3.0,<4",
    "scikit-learn>=1.0,<2",
    "scikit-posthocs>=0.7",
    "scipy>=1.7,<2",
    "seaborn>=0.11",
    "tqdm>=4.40",
    "yfinance>=0.2",
]

[tool.setuptools.packages.find]
include = ["src*"]
